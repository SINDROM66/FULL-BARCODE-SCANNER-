name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-offline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Offline APK
      run: |
        cd offline-android
        gradle assembleDebug --stacktrace --info

    - name: Upload Offline APK
      uses: actions/upload-artifact@v4
      with:
        name: offline-app-debug.apk
        path: offline-android/app/build/outputs/apk/debug/app-debug.apk

  build-online:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Online APK
      run: |
        cd android
        # Ensure top level gradle files exist
        if [ ! -f "settings.gradle" ]; then
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'OnlineScanner'" >> settings.gradle
          echo "include ':app'" >> settings.gradle
        fi
        if [ ! -f "build.gradle" ]; then
          echo "plugins { id 'com.android.application' version '8.1.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }" > build.gradle
        fi
        gradle assembleDebug --stacktrace --info

    - name: Upload Online APK
      uses: actions/upload-artifact@v4
      with:
        name: online-app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
